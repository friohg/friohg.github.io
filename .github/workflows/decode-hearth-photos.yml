name: Decode Hearth JPEGs

on:
  push:
    paths:
      - "hearth/*.jpg.b64"
      - ".github/workflows/decode-hearth-photos.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode ASCII payloads into real JPEGs and git push
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import base64
          from pathlib import Path
          root = Path("hearth")
          for src in sorted(root.glob("*.jpg.b64")):
              dest = root / src.name.replace(".jpg.b64", ".jpg")
              raw = base64.b64decode(src.read_text().strip(), validate=True)
              if raw[:3] != b"\xff\xd8\xff":
                  raise SystemExit(f"{src} is not a JPEG")
              dest.write_bytes(raw)
              print(f"wrote {dest} {len(raw)} bytes")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hearth/*.jpg
          if git diff --cached --quiet; then
            echo "JPEGs already current"
            exit 0
          fi
          git commit -m "Add Hearth Table sample JPEGs decoded from text payloads."
          git push
